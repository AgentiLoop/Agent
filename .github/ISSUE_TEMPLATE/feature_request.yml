name: ✨ Feature request
description: Suggest a new tool, bridge, provider, or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the task you want Agent! to do that it can't do (well) today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see? A new tool, a new app bridge / SDEF, a provider, a UI change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Tools (file / git / xcode / shell)
        - Automation (AppleScript / accessibility / bridges)
        - LLM providers / models
        - MCP
        - Launch Agent / Launch Daemon
        - UI / UX
        - Docs
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a PR for this
