<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="AgentiLoop Agent! — Native Swift macOS autonomous AI agent for coding, Xcode, Accessibility, AppleScript, and root shell execution.">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset=".25" stop-color="#ec4899"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset=".75" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="iconCircle" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#5b9cf0"/>
      <stop offset="100%" stop-color="#25549c"/>
    </radialGradient>
    <linearGradient id="accentText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <style>
      .s { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .m { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  <rect width="1280" height="8" fill="url(#stripe)"/>

  <!-- Subtle glowing grid accents -->
  <circle cx="1080" cy="140" r="240" fill="#3b82f6" opacity="0.10"/>
  <circle cx="220" cy="520" r="220" fill="#8b5cf6" opacity="0.10"/>

  <!-- Top Pill Badge -->
  <rect x="64" y="54" width="356" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="86" cy="72" r="5" fill="#22d3ee"/>
  <text x="102" y="77" class="s" font-size="13" font-weight="700" letter-spacing="1.2" fill="#bae6fd">100% NATIVE SWIFT 6.4 · MACOS 14.6+</text>

  <!-- Official Agent! App Icon (scaled from 497.99x497.99 viewBox) -->
  <g transform="translate(64, 114) scale(0.185)">
    <circle cx="249" cy="249" r="249" fill="url(#iconCircle)"/>
    <g stroke="#FFFFFF" stroke-width="6" opacity="0.9">
      <line x1="121.35" y1="81.88" x2="54.17" y2="199.45"/>
      <line x1="121.35" y1="81.88" x2="248.99" y2="165.86"/>
      <line x1="248.99" y1="31.49" x2="54.17" y2="199.45"/>
      <line x1="248.99" y1="31.49" x2="248.99" y2="165.86"/>
      <line x1="248.99" y1="31.49" x2="443.82" y2="199.45"/>
      <line x1="376.64" y1="81.88" x2="248.99" y2="165.86"/>
      <line x1="376.64" y1="81.88" x2="443.82" y2="199.45"/>
      <line x1="54.17" y1="199.45" x2="121.35" y2="317.02"/>
      <line x1="248.99" y1="165.86" x2="121.35" y2="317.02"/>
      <line x1="248.99" y1="165.86" x2="376.64" y2="317.02"/>
      <line x1="443.82" y1="199.45" x2="376.64" y2="317.02"/>
      <line x1="121.35" y1="317.02" x2="154.94" y2="434.59"/>
      <line x1="121.35" y1="317.02" x2="248.99" y2="468.18"/>
      <line x1="376.64" y1="317.02" x2="248.99" y2="468.18"/>
      <line x1="376.64" y1="317.02" x2="343.05" y2="434.59"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="248.99" cy="248.99" r="30.4"/>
      <circle cx="248.99" cy="191.99" r="11.4"/>
      <circle cx="298.40" cy="275.60" r="11.4"/>
      <circle cx="199.59" cy="275.60" r="11.4"/>
      <circle cx="248.99" cy="468.18" r="18.5"/>
      <circle cx="154.94" cy="434.59" r="18.5"/>
      <circle cx="343.05" cy="434.59" r="18.5"/>
      <circle cx="121.35" cy="317.02" r="21.8"/>
      <circle cx="376.64" cy="317.02" r="21.8"/>
      <circle cx="54.17" cy="199.45" r="23.5"/>
      <circle cx="443.82" cy="199.45" r="23.5"/>
      <circle cx="121.35" cy="81.88" r="20.2"/>
      <circle cx="376.64" cy="81.88" r="20.2"/>
      <circle cx="248.99" cy="31.49" r="20.2"/>
